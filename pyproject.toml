[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2md"
version = "0.1.1"
description = "High-fidelity academic paper PDF to Markdown converter with LaTeX formula OCR, figure extraction, and character/font healing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["academic", "paper", "pdf-to-markdown", "latex", "ocr", "obsidian", "katex", "scientific"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pymupdf>=1.24.0",
    "pymupdf4llm>=1.28.0",
    "rapid_latex_ocr>=0.0.9",
    "requests>=2.28.0",
    "opencv-python-headless>=4.8.0",
]

[project.scripts]
paper2md = "paper2md.cli:main"
